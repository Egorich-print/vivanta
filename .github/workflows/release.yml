name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0-alpha)"
        required: true
        default: "v0.1.0-alpha"
        type: string
      prerelease:
        description: "Mark as prerelease (experimental kernel)"
        required: true
        default: true
        type: boolean

permissions:
  contents: write   # required for `gh release create`; read-only would 403

jobs:
  kernel:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: build userland + targets
        working-directory: vivanta-boot
        run: |
          ./tools/build-user-init.sh
          cargo build -p vivanta-target-qemu-aarch64
          cargo build -p vivanta-target-rk3568
      - name: package binaries
        working-directory: vivanta-boot
        run: |
          ./tools/rust-objcopy.sh -O binary \
            target/aarch64-unknown-none/debug/vivanta-target-rk3568 vivanta-target-rk3568.bin
          cp target/aarch64-unknown-none/debug/vivanta-target-qemu-aarch64 .
          cp user-init/user-init.elf .
          sha256sum vivanta-target-qemu-aarch64 vivanta-target-rk3568.bin user-init.elf > SHA256SUMS
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-binaries
          path: |
            vivanta-boot/vivanta-target-qemu-aarch64
            vivanta-boot/vivanta-target-rk3568.bin
            vivanta-boot/user-init.elf
            vivanta-boot/SHA256SUMS
          if-no-files-found: error

  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mtools dosfstools
      - name: fetch RPi firmware (release "assets")
        env:
          GH_TOKEN: ${{ github.token }}
        continue-on-error: true   # fall back to upstream raspberrypi/firmware
        run: |
          mkdir -p vivanta-boot/images/rpi3b-plus/firmware
          gh release download assets -R "$GITHUB_REPOSITORY" \
            --pattern 'rpi3b-firmware-*.tar.gz' --output fw.tar.gz --clobber
          tar xzf fw.tar.gz -C vivanta-boot/images/rpi3b-plus/firmware
      - name: build SD image
        working-directory: vivanta-boot
        run: |
          ./tools/build-user-init.sh
          ./tools/make-rpi3b-image.sh
          ( cd images/rpi3b-plus && sha256sum vivanta-rpi3b-plus.img kernel8.img > SHA256SUMS )
          cat images/rpi3b-plus/SHA256SUMS
      - uses: actions/upload-artifact@v4
        with:
          name: rpi3b-image
          path: |
            vivanta-boot/images/rpi3b-plus/vivanta-rpi3b-plus.img
            vivanta-boot/images/rpi3b-plus/kernel8.img
            vivanta-boot/images/rpi3b-plus/SHA256SUMS
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [kernel, image]
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          find dist -type f | sort
          flags="--prerelease"
          [ "${{ inputs.prerelease }}" = "true" ] || flags=""
          gh release create "${{ inputs.tag }}" -R "$GITHUB_REPOSITORY" $flags \
            --title "Vivanta ${{ inputs.tag }}" \
            --notes "Experimental bare-metal AArch64 kernel, built from \`${{ github.sha }}\`.

          **Artifacts**
          - \`vivanta-rpi3b-plus.img\` — flashable SD-card image (Raspberry Pi 3B+), plus \`kernel8.img\`
          - \`vivanta-target-qemu-aarch64\` — QEMU \`virt\` kernel ELF
          - \`vivanta-target-rk3568.bin\` — flat RK3568 kernel binary
          - \`user-init.elf\` — the embedded EL0 userland image
          - \`SHA256SUMS\` next to each artifact

          Not validated on physical hardware yet. Honest status: QEMU-correct." \
            dist/kernel-binaries/* dist/rpi3b-image/*
