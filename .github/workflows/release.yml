name: release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag (e.g. v0.1.0-alpha)"
        required: true
        default: "v0.1.0-alpha"
        type: string
      prerelease:
        description: "Mark as prerelease (experimental kernel)"
        required: true
        default: true
        type: boolean

permissions:
  contents: read

jobs:
  kernel:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}   # build exactly what the tag names
      - name: verify the tag exists and is what we build
        run: |
          git rev-parse --verify "refs/tags/${{ inputs.tag }}" >/dev/null
          echo "tag    ${{ inputs.tag }} -> $(git rev-parse "refs/tags/${{ inputs.tag }}")"
          echo "built  $(git rev-parse HEAD)"
      - name: build userland + targets
        working-directory: vivanta-boot
        run: |
          ./tools/build-user-init.sh
          cargo build -p vivanta-target-qemu-aarch64
          cargo build -p vivanta-target-rk3568
      - name: package binaries
        working-directory: vivanta-boot
        run: |
          ./tools/rust-objcopy.sh -O binary \
            target/aarch64-unknown-none/debug/vivanta-target-rk3568 vivanta-target-rk3568.bin
          cp target/aarch64-unknown-none/debug/vivanta-target-qemu-aarch64 .
          cp user-init/user-init.elf .
          sha256sum vivanta-target-qemu-aarch64 vivanta-target-rk3568.bin user-init.elf > SHA256SUMS-kernel
          ls -la
      - uses: actions/upload-artifact@v4
        with:
          name: kernel-binaries-${{ github.run_attempt }}
          path: |
            vivanta-boot/vivanta-target-qemu-aarch64
            vivanta-boot/vivanta-target-rk3568.bin
            vivanta-boot/user-init.elf
            vivanta-boot/SHA256SUMS-kernel
          if-no-files-found: error

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
      - name: tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq mtools dosfstools
      - name: fetch RPi firmware (release "assets", else upstream)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p vivanta-boot/images/rpi3b-plus/firmware
          if gh release download assets -R "$GITHUB_REPOSITORY" \
               --pattern 'rpi3b-firmware-*.tar.gz' --output fw.tar.gz --clobber \
             && [ -s fw.tar.gz ]; then
            tar xzf fw.tar.gz -C vivanta-boot/images/rpi3b-plus/firmware
            echo "firmware: from release assets"
          else
            rm -f fw.tar.gz
            echo "firmware: assets release unavailable — make-rpi3b-image.sh will fetch upstream"
          fi
      - name: build SD image
        working-directory: vivanta-boot
        run: |
          ./tools/build-user-init.sh
          ./tools/make-rpi3b-image.sh
          ( cd images/rpi3b-plus && sha256sum vivanta-rpi3b-plus.img kernel8.img > SHA256SUMS-rpi3b )
          cat images/rpi3b-plus/SHA256SUMS-rpi3b
      - uses: actions/upload-artifact@v4
        with:
          name: rpi3b-image-${{ github.run_attempt }}
          path: |
            vivanta-boot/images/rpi3b-plus/vivanta-rpi3b-plus.img
            vivanta-boot/images/rpi3b-plus/kernel8.img
            vivanta-boot/images/rpi3b-plus/SHA256SUMS-rpi3b
          if-no-files-found: error

  publish:
    runs-on: ubuntu-latest
    needs: [kernel, image]
    permissions:
      contents: write   # only this job may create the release
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: "*-${{ github.run_attempt }}"
          path: dist
      - name: publish
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          case "$TAG" in
            v[0-9]*|M[0-9]*) ;;
            *) echo "refusing to release under unexpected tag: $TAG" >&2; exit 1 ;;
          esac
          find dist -type f | sort
          flags=""
          [ "${{ inputs.prerelease }}" = "true" ] && flags="--prerelease"
          gh release create "$TAG" -R "$GITHUB_REPOSITORY" $flags \
            --title "Vivanta $TAG" \
            --notes "Experimental bare-metal AArch64 kernel, built from the $TAG tag.

          **Artifacts**
          - \`vivanta-rpi3b-plus.img\` — flashable SD-card image (Raspberry Pi 3B+), plus \`kernel8.img\`
          - \`vivanta-target-qemu-aarch64\` — QEMU \`virt\` kernel ELF
          - \`vivanta-target-rk3568.bin\` — RK3568 **diagnostic adapter** binary (not a Vivanta kernel: that target does not link one)
          - \`user-init.elf\` — the embedded EL0 userland image
          - \`SHA256SUMS-kernel\` / \`SHA256SUMS-rpi3b\` checksums

          Not validated on physical hardware yet. Honest status: QEMU-correct." \
            dist/kernel-binaries-*/* dist/rpi3b-image-*/*
