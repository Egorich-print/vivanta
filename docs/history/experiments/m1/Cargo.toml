[package]
name = "theseus-m1"
version = "0.1.0"
edition = "2021"
description = "Theseus OS M1: Continuity Proof Experiment"

[[bin]]
name = "theseus-m1"
path = "src/main.rs"

[dependencies]
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["getrandom"] }
sha2 = "0.10"
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
