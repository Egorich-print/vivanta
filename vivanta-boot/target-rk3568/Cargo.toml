[package]
name = "vivanta-target-rk3568"
version = "0.1.0"
edition = "2024"
description = "Vivanta — Rockchip RK3568 target binary"

[dependencies]
vivanta-boot-common = { path = "../boot_common" }

# Bare-metal firmware binary (no_main + linker script): no host libtest.
# EL2 diagnostic only — does not link vivanta-kernel. Verified on silicon
# (Stage 1-2 UART output, 2026-07-19); this revision is untested there.
[[bin]]
name = "vivanta-target-rk3568"
path = "src/main.rs"
test = false
