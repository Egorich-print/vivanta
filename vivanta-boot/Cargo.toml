[workspace]

resolver = "2"

members = [
    # --- Shared libraries ---
    "boot-info",
    "boot_common",
    "arch-api",
    "arch-aarch64",
    "arch-armv7a",

    # --- Kernel ---
    "kernel",

    # --- Platform support ---
    "platform-qemu",
    "platform-rk3568",
    "platform-sdm660",
    "platform-allwinner-h616",
    "platform-amlogic",
    "platform-rpi3b",

    # --- Target binaries ---
    "target-qemu-aarch64",
    "target-rk3568",
    "target-x96q",
    "target-lavender",
    "target-rpi3b-plus",
    "target-suma-q5",

    # --- Test / proof ---
    "arch-test-stub",
    "target-test",
    "target-mmu-test",
]

[profile.dev]
panic = "abort"

[profile.release]
panic = "abort"
opt-level = "z"
lto = true
debug = false
