[package]
name = "vivanta-kernel"
version = "0.1.0"
edition = "2024"
description = "Vivanta — architecture-independent kernel logic"

# No host libtest harness: kernel links arch-api extern "Rust" symbols that only
# exist for aarch64-unknown-none, and installs a boot-time global allocator.
# Kernel invariants are verified via boot self-tests (verify.rs) + QEMU.
[lib]
test = false

[features]
trace-address-space = []

[dependencies]
vivanta-boot-info = { path = "../boot-info" }
vivanta-boot-common = { path = "../boot_common" }
vivanta-arch-api = { path = "../arch-api" }
vivanta-vm = { path = "../vm" }