[package]
name = "vivanta-target-test"
version = "0.1.0"
edition = "2024"
description = "Build-time proof: kernel links with arch-test-stub instead of a real arch"

[dependencies]
vivanta-boot-info = { path = "../boot-info" }
vivanta-boot-common = { path = "../boot_common" }
vivanta-arch-api = { path = "../arch-api" }
vivanta-arch-test-stub = { path = "../arch-test-stub" }
vivanta-kernel = { path = "../kernel" }

# Bare-metal firmware binary (no_main + linker script): no host libtest.
# Verified via QEMU boot.
[[bin]]
name = "vivanta-target-test"
path = "src/main.rs"
test = false
