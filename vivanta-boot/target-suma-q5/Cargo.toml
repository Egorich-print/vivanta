[package]
name = "vivanta-target-suma-q5"
version = "0.1.0"
edition = "2024"
description = "Vivanta — Sumavision Q5 TV box (Amlogic S905L, GXL) target binary"

[dependencies]
vivanta-boot-common = { path = "../boot_common" }
vivanta-boot-info = { path = "../boot-info" }
vivanta-arch-api = { path = "../arch-api" }
vivanta-arch-aarch64 = { path = "../arch-aarch64" }
vivanta-platform-amlogic = { path = "../platform-amlogic" }
vivanta-kernel = { path = "../kernel" }

# Bare-metal firmware binary (no_main + linker script): no host libtest.
# Cannot print: platform-amlogic never registers a console, so it panics
# immediately on the first println!.
[[bin]]
name = "vivanta-target-suma-q5"
path = "src/main.rs"
test = false
