# Toolchain policy (ratified 2026-08-21)
#
# Vivanta targets Rust 1.98.0 stable across the whole workspace, including
# the freestanding aarch64-unknown-none kernel targets. No nightly features
# are used; pinning stable keeps host unit tests, clippy and the QEMU
# kernel build on one reproducible compiler.
[toolchain]
channel = "1.98.0"
# armv7a-none-eabihf is here for the PORTABLE base: `arch-api`, `boot-info`,
# `boot_common` and `vm` must compile for a 32-bit ARMv7-A device (the teXet
# TB-176FL's Cortex-A8) unchanged — see tools/armv7-portability.sh and
# ADR-036. The kernel itself is still AArch64-only (ADR-011).
targets = ["aarch64-unknown-none", "armv7a-none-eabihf"]
# rustfmt: local + CI formatting gate. llvm-tools: rust-objcopy for the RPi
# kernel8.img / RK3568 .bin conversions in tools/make-rpi3b-image.sh.
components = ["rustfmt", "clippy", "llvm-tools"]
