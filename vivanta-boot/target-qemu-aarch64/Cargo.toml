[package]
name = "vivanta-target-qemu-aarch64"
version = "0.1.0"
edition = "2021"
description = "Vivanta — QEMU AArch64 target binary"

[dependencies]
vivanta-boot-info = { path = "../boot-info" }
vivanta-boot-common = { path = "../boot_common" }
vivanta-arch-api = { path = "../arch-api" }
vivanta-arch-aarch64 = { path = "../arch-aarch64" }
vivanta-platform-qemu = { path = "../platform-qemu" }
vivanta-kernel = { path = "../kernel" }

# Bare-metal firmware binary (no_main + linker script): no host libtest.
# Verified via QEMU boot.
[[bin]]
name = "target_qemu_aarch64"
path = "src/main.rs"
test = false
